<div class="container mt-4" *ngIf="cart">
  <h3>Your Cart</h3>

  <div *ngFor="let item of cart.items" class="card mb-3 p-3">
    <div class="d-flex justify-content-between">
      <div>
        <h5>{{ item.name }}</h5>
        <p>{{ item.price }} x {{ item.quantity }}</p>
      </div>
      <button
        class="btn btn-danger"
        (click)="remove(item.productId)">
        Remove
      </button>
    </div>
  </div>

  <h4 class="text-end">Total: {{ total }} EGP</h4>
</div>

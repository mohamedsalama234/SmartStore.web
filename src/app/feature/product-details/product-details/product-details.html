<div class="container mt-5" *ngIf="product">
  <div class="row">
    <div class="col-md-6">
      <img title="img" [src]="product.imageUrl" class="img-fluid rounded shadow" />
    </div>
    <div class="col-md-6">
      <h2>{{ product.name }}</h2>
      <h4 class="text-primary">{{ product.price }} EGP</h4>
      <p class="text-muted">{{ product.description }}</p>

      <button class="btn btn-success btn-lg mt-3">
        Add To Cart
      </button>

      <button
  class="btn btn-success btn-lg mt-3"
  (click)="addToCart()">
  Add To Cart
</button>
    </div>
  </div>
</div>
